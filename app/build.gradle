plugins { id 'com.android.application' }

// Release signing comes from environment variables (set by CI from repo secrets).
// Without them, release builds fall back to the debug key.
def ksFile = System.getenv('SIGNING_KEYSTORE_FILE')
def hasReleaseKey = ksFile && file(ksFile).exists()

android {
    namespace 'app.ussdlab'
    compileSdk 34
    defaultConfig {
        applicationId 'app.ussdlab'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.3'
    }
    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(ksFile)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles 'proguard-rules.pro'
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
