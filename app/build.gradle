plugins { id 'com.android.application' }

android {
    namespace 'app.ussdlab'
    compileSdk 34
    defaultConfig {
        applicationId 'app.ussdlab'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }
    buildTypes {
        release { minifyEnabled true; shrinkResources true; signingConfig signingConfigs.debug }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
